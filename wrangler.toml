name = "seo-data-mcp"
main = "billing/worker.mjs"
compatibility_date = "2026-10-22"
workers_dev = true
routes = [{ pattern = "seo-data.atesensoftware.com", custom_domain = true }]
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/paddle", "/healthz"]
# D1 binding and Paddle values are intentionally absent until provisioning is complete.
# Never put sandbox credentials into this production worker.
